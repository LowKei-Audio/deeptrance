name: Build

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag, for example v1.0.2 (leave empty for a plain build)"
        required: false
        default: ""

permissions:
  contents: write # needed only by the release step (tags)

env:
  CLAP_VALIDATOR_TAG: 0.4.1  # 0.3.x no longer compiles on current Rust (same pin as Compass)

jobs:
  # Fast check: DSP unit tests only (no JUCE download).
  dsp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDT_BUILD_PLUGIN=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The real product: Windows VST3 + CLAP + Standalone, validated, packaged.
  windows:
    needs: dsp-tests   # nothing is built or published unless the Linux tests pass
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: DSP unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Factory presets render cleanly
        run: build/DeepTranceRender_artefacts/Release/DeepTranceRender.exe

      - name: pluginval (strictness 10)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 10 --validate-in-process --timeout-ms 900000 --validate "build/DeepTrance_artefacts/Release/VST3/DeepTrance.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Steinberg VST3 validator
        shell: pwsh
        run: |
          git clone --depth 1 --branch v3.8.1_build_84 https://github.com/steinbergmedia/vst3sdk.git vst3sdk
          git -C vst3sdk submodule update --init --depth 1 base cmake pluginterfaces public.sdk
          cmake -S vst3sdk -B vst3sdk/build -A x64 -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=ON -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF -DSMTG_RUN_VST_VALIDATOR=OFF
          cmake --build vst3sdk/build --config Release --target validator
          $validator = Get-ChildItem vst3sdk/build -Recurse -Filter validator.exe | Select-Object -First 1
          & $validator.FullName "build/DeepTrance_artefacts/Release/VST3/DeepTrance.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # clap-validator exits non-zero if any conformance test fails. Built from
      # source with cargo at a pinned tag, the same way Compass does it.
      - name: clap-validator
        shell: pwsh
        run: |
          cargo install --locked --git https://github.com/free-audio/clap-validator --tag $env:CLAP_VALIDATOR_TAG clap-validator
          clap-validator validate "build/DeepTrance_artefacts/Release/CLAP/DeepTrance.clap"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(DeepTrance VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" "/DBuildDir=..\build" installer\DeepTrance.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload VST3, CLAP, Standalone and installer
        uses: actions/upload-artifact@v4
        with:
          name: DeepTrance-Windows-x64
          path: |
            build/DeepTrance_artefacts/Release/VST3/DeepTrance.vst3
            build/DeepTrance_artefacts/Release/CLAP/DeepTrance.clap
            build/DeepTrance_artefacts/Release/Standalone/DeepTrance.exe
            installer/Output/*.exe

      # On a pushed v* tag, or a manual run given a release_tag (creates the tag at this commit).
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ inputs.release_tag || github.ref_name }}"
          target_commitish: "${{ github.sha }}"
          name: "DeepTrance ${{ inputs.release_tag || github.ref_name }}"
          files: installer/Output/*.exe
          generate_release_notes: true
