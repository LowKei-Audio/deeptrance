name: Build

on:
  push:
    branches: [ main, dev ]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast check: DSP unit tests only (no JUCE download).
  dsp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDT_BUILD_PLUGIN=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The real product: Windows VST3 + Standalone, validated with pluginval.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: DSP unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: pluginval (strictness 10)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 10 --validate-in-process --timeout-ms 600000 --validate "build/DeepTrance_artefacts/Release/VST3/DeepTrance.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload VST3 + Standalone
        uses: actions/upload-artifact@v4
        with:
          name: DeepTrance-Windows-x64
          path: |
            build/DeepTrance_artefacts/Release/VST3/DeepTrance.vst3
            build/DeepTrance_artefacts/Release/Standalone/DeepTrance.exe
